# crates/kd-encoder/Cargo.toml

[package]
name = "kd-encoder"
version.workspace = true
edition.workspace = true

[dependencies]
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
bytes.workspace = true
serde.workspace = true
openh264 = { version = "0.9.0", optional = true }
rayon = "1.11.0"

# FFmpeg with hardware acceleration support (recommended)
[dependencies.ffmpeg-next]
version = "8.0.0"
optional = true
default-features = false
features = ["codec", "format"]

[dependencies.nvenc]
version = "0.1.0"
optional = true

# Platform-specific hardware encoders
[target.'cfg(windows)'.dependencies]
kd-win32 = { path = "../kd-win32" }

[features]
default = ["ffmpeg"]
ffmpeg = ["dep:ffmpeg-next"]
openh264 = ["dep:openh264"]
nvenc = ["dep:nvenc"]